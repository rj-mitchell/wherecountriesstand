# The test set (docs/DECISIONS.md, 10): questions with the filters a careful reader would choose, and what the
# evidence must contain.
#
# Used by `wcs evaluate`, which scores (1) how each question is read: each filter compared with `expect`, and
# (2) the evidence found: whether it is empty when it should be ("No records found" is the right answer to
# `no_records` questions), and whether it includes the countries in `include` (at least one source from each).
#
# Filters not listed under `expect` are expected to be empty. Dates: `date_from` and `date_to` are compared by year;
# "default" means the site's default range (the last 10 years) because the question gives no dates; `date_from` alone
# leaves the end open. `<field>_any` lists acceptable alternatives ("General Assembly resolutions" may or may not limit
# the statements to the General Assembly). `sources`: "sc" Security Council, "gd" General Debate (none = both). `groups` use the
# reference keys (p5, council_elected, eu, nato, au, ldc, lldc, sids, region:africa ...).
# The questions are read as if today were 25 October 2026.

today = "2026-10-25"

# ---- topics, no filters --------------------------------------------------------------------------------------------

[[q]]
id = "climate-security"
question = "How have countries described climate change as a threat to peace and security?"
category = "topic"
expect = { date_from = "default" }

