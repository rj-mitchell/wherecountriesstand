# Checks every push and pull request: lint, the tests (offline: the model is faked), that the family kit's copy in
# web/site/family/ is the version this site was last synced to, that the Docker image builds and starts, and every
# page for accessibility problems (scripts/a11y.mjs).
#
# The jobs that are the same on every Where They Stand site are the shared workflows of wts-core, called at the tag
# of the package this site installs (pyproject.toml): the two are raised together, by hand, in one change
# (wts-core docs/adr/0010; tests/test_dependencies.py checks they agree, and Dependabot is told to leave them).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # uv sync --frozen, ruff, pytest, with the family's Python and uv
  python:
    uses: rj-mitchell/wts-core/.github/workflows/python.yml@v0.2.0
    with:
      lint-paths: "src tests scripts"

  # The Where They Stand family kit version last synced into web/site/family/ (docs/DEPLOY.md, "Pages and the
  # family kit"). Raise it in the same change as a new sync.
  kit:
    uses: rj-mitchell/wts-core/.github/workflows/kit.yml@v0.2.0
    with:
      version: "1.4.0"
      site: countries
      path: web/site/family

  # The image the server runs: built as update.sh builds it, and its command line started once
  docker:
    uses: rj-mitchell/wts-core/.github/workflows/docker.yml@v0.2.0
    with:
      tag: wherecountriesstand:ci
      run: wcs --help

  # Every page served by the app (with no data loaded and no API key: the pages, their scripts and the empty states)
  # is checked with axe for WCAG 2.2 AA problems, light and dark, at desktop and phone widths, as Where MPs Stand
  # does. A serious or critical problem, or a page that scrolls sideways, fails the check (scripts/a11y.mjs).
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rj-mitchell/wts-core/.github/actions/setup@v0.2.0
      - name: Install
        run: uv sync --frozen
      - name: Start the site with no data
        run: |
          mkdir -p /tmp/wcs-data
          WCS_DATA_DIR=/tmp/wcs-data nohup uv run wcs serve --port 8000 > /tmp/wcs.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/status.html | grep -q "/api/status"
          curl -fsS http://localhost:8000/api/status | grep -q '"briefings"'
      - name: Accessibility check (axe, WCAG 2.2 AA, light and dark, desktop and phone)
        uses: rj-mitchell/wts-core/.github/actions/a11y@v0.2.0
        with:
          url: http://localhost:8000
      - name: Show the site's log if anything failed
        if: failure()
        run: cat /tmp/wcs.log || true
