# Where Countries Stand settings. Paths are relative to the repository root unless absolute.
# Environment overrides: WCS_DATA_DIR, WCS_CONFIG, WCS_ANTHROPIC_API_KEY.

[paths]
data_dir = "data"

[archive]
# The main collection starts in 1992 (docs/DECISIONS.md, 3): the Russian Federation holds the Soviet seat, and
# 179 of today's 193 members are present. The General Debate and General Assembly votes go back to 1946 as an
# archive, searched only when a question asks for earlier years.
start_date = "1992-01-01"
archive_start_date = "1946-01-01"
# Briefings default to this many most recent years unless the question gives dates.
default_years = 10
# Records before this year are OCR text of scanned documents, and are labelled as such.
born_digital_from = 1994

[live]
# From this date on, Security Council records come from the UN's own verbatim records (`wcs update`), parsed by
# wcs.sources.undocs; the corpus keeps the years before (docs/DECISIONS.md, 4; docs/VALIDATION.md).
sc_from = "2024-01-01"
# The last meeting before sc_from (S/PV.9524, December 2023): where discovery starts when neither the corpus nor any
# fetched record says otherwise.
sc_after_meeting = 9524
# From this session on, the General Debate comes from the General Assembly's verbatim records (A/<session>/PV.<n>),
# parsed by wcs.sources.unga; the corpus keeps the sessions before. The records appear about a year after the debate,
# and until then the General Debate website fills in. From the 79th session (2024): the corpus's texts for 2024 are the
# delegations' own, as prepared, and for 2025 an AI transcript of the interpretation, not the record.
gd_from_session = 79
# Until a session's official records are out, take its statements from the UN's General Debate website
# (gadebate.un.org; wcs.sources.gadebate), labelled as not yet the official record (docs/DECISIONS.md, 12).
gd_website = true
# Statements read from the website elsewhere, for a server it refuses (data_static/<this>/records-<session>.json):
# imported by the update once each (docs/OPERATIONS.md). Empty to leave them out.
gd_bundled = "gd_website"

[sources]
# Harvard Dataverse file ids (CC0). The General Debate corpus asks for a guestbook entry, so it is downloaded by
# hand into data/raw/ungd/ (see docs/DATA.md).
sc_meta = "https://dataverse.harvard.edu/api/access/datafile/10809806"
sc_speakers = "https://dataverse.harvard.edu/api/access/datafile/10809807"
sc_speeches = "https://dataverse.harvard.edu/api/access/datafile/10809805"
# The General Debate corpus's guestbook (wcs.sources.ungd.fetch): name and email come from the environment
# (WCS_GUESTBOOK_NAME, WCS_GUESTBOOK_EMAIL in deploy/.env), never from this file.
ungd_guestbook = { institution = "Where They Stand", position = "Project lead", purpose = "Research" }
# UN Digital Library: General Assembly voting data (non-commercial use, with attribution).
votes_record = "https://digitallibrary.un.org/record/4060887"
# Where a document symbol resolves to the document itself.
undocs = "https://undocs.org/en/"

[ranking]
candidates_bm25 = 300
candidates_vector = 300
vector_refine_factor = 5
# Weight of normalised BM25 vs cosine similarity in the relevance score.
bm25_weight = 0.5
# Recency factor = floor + (1 - floor) * 0.5 ** (age_years / half_life).
# Slider s in [0, 1]: s = 0 disables decay; otherwise half_life = min_half_life_years / s.
recency_floor = 0.35
min_half_life_years = 3.0
default_recency = 0.4
# Role weight slider W in [1.0, 2.0]; authority = 1 + (W - 1) * m. A statement by a head of state or government
# or a foreign minister speaks for a government more plainly than a delegate's.
default_role_weight = 1.3
m_head = 1.0
m_minister = 0.7
m_representative = 0.3
# Evidence selection for briefings: balance across country groups.
max_per_speaker = 2
max_per_country = 2
min_relevance_ratio = 0.25

[answer]
model = "claude-sonnet-5-5"
query_parse_model = "claude-haiku-5-5"
summary_sources = 24
comprehensive_sources = 40
summary_effort = "medium"
comprehensive_effort = "high"
query_parse_effort = "low"
max_tokens = 16000
use_fallbacks = true
# How the instructions to the model are kept in the provider's prompt cache between requests: "short" (a few
# minutes, as always), "long" (an hour, which costs more to write) or "off".
cache_instructions = "short"

[embedding]
# "fastembed" (local ONNX model; weights fetched once from Hugging Face and pinned)
# or "hashing" (deterministic, offline; for tests only).
backend = "fastembed"
model = "snowflake/snowflake-arctic-embed-xs"
dim = 384
passage_words = 250
batch_size = 8

[usage]
# The site is public; each new model-written briefing costs money (docs/DECISIONS.md, 9). When a cap is reached the
# sources are still shown, which costs nothing.
daily_spend_cap_usd = 3.0
monthly_spend_cap_usd = 50.0
per_visitor_daily_questions = 40   # anonymous visitors, keyed by a daily-salted hash of their IP address
requests_per_minute = 20           # questions and searches per visitor
answer_cache_hours = 168           # identical questions are not re-run until the data changes (or a week)
# A briefing's cost is known only when it is finished, so each one being written is counted at this estimate
# against the caps meanwhile (a summary costs a few cents, a comprehensive briefing more), and only so many are
# written at once: many questions arriving together cannot all slip past a cap.
briefing_estimate_usd = 0.10
briefings_at_once = 8
briefings_at_once_per_visitor = 2
# USD per million tokens, for spend tracking only (as Where MPs Stand's settings).
price_input_per_mtok = 2.0
price_output_per_mtok = 10.0
price_cache_read_per_mtok = 0.2
cache_write_multiplier = 1.25

[usage.models."claude-haiku-5-5"]
price_input_per_mtok = 0.1
price_output_per_mtok = 0.5
price_cache_read_per_mtok = 0.01

[site]
# The site's pages (default: web/site in the repository).
dir = ""
# The site's public address, for robots.txt, the sitemap and link previews (default: WCS_SITE_URL, or https://
# and DOMAIN, or the address it was reached at).
url = ""
