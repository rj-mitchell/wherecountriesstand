[project]
name = "wcs"
version = "0.1.0"
description = "Where Countries Stand: sourced briefings on what countries have said and how they have voted at the United Nations."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "duckdb>=1.1",
    "httpx>=0.27",
    "lancedb>=0.17",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.optional-dependencies]
# Local open-source embedding models (ONNX runtime). Weights are downloaded once
# from Hugging Face at setup and pinned; no data is fetched from Hugging Face.
embed = ["fastembed>=0.4"]

[project.scripts]
wcs = "wcs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
